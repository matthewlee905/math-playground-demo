<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="小四數學：兩位數乘兩位數互動遊戲">
  <title>乘法探險隊｜兩位數乘兩位數</title>
  <style>
    :root{--ink:#17324d;--muted:#5b7185;--paper:#f7fbff;--line:#d9e7f2;--blue:#2376d8;--deep:#1451a0;--mint:#dff7ee;--yellow:#fff1b8;--coral:#ff806d;--shadow:0 12px 30px #193b5619}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eaf6ff,#fffdf2);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;min-height:100vh}
    button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}.app{max-width:920px;margin:auto;padding:clamp(14px,3vw,32px)}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:2.4rem;filter:drop-shadow(0 3px 0 #fff)}h1{font-size:clamp(1.35rem,3vw,2rem);margin:0}h2{margin:0 0 8px;font-size:clamp(1.25rem,3vw,1.7rem)}p{line-height:1.65;margin:7px 0}.sub{color:var(--muted);font-size:.95rem}.sound{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;color:var(--ink);font-weight:700}.screen{background:#ffffffdf;border:1px solid #fff;border-radius:28px;padding:clamp(20px,4vw,42px);box-shadow:var(--shadow)}
    .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.mode{background:#fff;border:3px solid var(--line);border-radius:20px;padding:20px;text-align:left;min-height:185px;transition:.15s;box-shadow:0 5px 0 #dce9f2}.mode:hover,.mode:focus-visible{transform:translateY(-3px);border-color:var(--blue)}.mode .emoji{font-size:2rem}.mode h3{font-size:1.25rem;margin:8px 0}.mode p{font-size:.9rem;color:var(--muted)}.rules{background:var(--paper);border-radius:16px;padding:15px 18px;font-size:.95rem}.hide{display:none!important}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.pill{background:var(--yellow);border-radius:999px;padding:7px 13px;font-weight:800}.progress{height:10px;background:#e6eff5;border-radius:99px;overflow:hidden;margin:10px 0 25px}.progress i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}.question{text-align:center}.equation{font-size:clamp(2.6rem,10vw,5rem);font-weight:900;letter-spacing:.08em;margin:20px 0;color:var(--deep)}.prompt{font-size:clamp(1.15rem,3vw,1.45rem);font-weight:800;margin:12px auto;max-width:680px}.hint{background:#f3f9ff;border-left:5px solid var(--blue);padding:12px 16px;text-align:left;border-radius:8px;margin:18px auto;max-width:680px}.options{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:20px auto;max-width:700px}.choice{background:#fff;border:3px solid #c9dceb;border-radius:16px;padding:14px 20px;min-width:92px;font-size:1.25rem;font-weight:900;color:var(--ink);box-shadow:0 4px 0 #d9e7f2}.choice:hover,.choice:focus-visible{border-color:var(--blue);background:#eff7ff}.choice.correct{background:#d9f7e9;border-color:#26a269}.choice.wrong{background:#ffe2dc;border-color:var(--coral)}.feedback{min-height:38px;font-weight:800;font-size:1.1rem;padding:5px}.next{background:var(--blue);color:#fff;border-radius:14px;padding:13px 25px;font-weight:900;font-size:1.1rem;margin-top:10px;box-shadow:0 4px 0 var(--deep)}.next:active{transform:translateY(2px);box-shadow:none}.next:disabled{opacity:.45;cursor:not-allowed}.vertical{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(2.3rem,8vw,4rem);font-weight:900;line-height:1.12;text-align:right;width:210px;margin:16px auto;border-bottom:6px solid var(--ink)}.vertical small{display:block;font-size:.8rem;text-align:left;color:var(--blue);font-family:inherit;margin-left:-145px;white-space:nowrap}.step-label{font-weight:900;color:var(--deep);font-size:1.15rem}.tag{display:inline-block;border-radius:8px;background:var(--mint);padding:4px 9px;color:#176747;font-weight:800;font-size:.9rem}.result{text-align:center}.big-score{font-size:4.2rem;font-weight:900;color:var(--deep);margin:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{background:var(--paper);padding:14px;border-radius:15px;font-weight:800}.stat b{display:block;font-size:1.45rem;margin-top:3px}.medal{font-size:2.7rem;margin:13px}.result-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:22px}.secondary{background:#e8f1f8;color:var(--ink);border-radius:14px;padding:12px 18px;font-weight:900}.footer-note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:17px}.estimate{font-size:1.15rem;font-weight:800}.home-link{background:transparent;color:var(--muted);text-decoration:underline;padding:8px}
    .play-area{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:26px;align-items:start}.question-main{min-width:0}.workpad{background:#f7fbff;border:3px solid #cfe2f0;border-radius:20px;padding:16px 12px;position:sticky;top:12px}.workpad h3{margin:0 0 8px;color:var(--deep);font-size:1.05rem}.workpad .vertical{margin:12px auto 4px;border-bottom:0;width:210px;text-align:right}.workpad .vrow{height:1.12em;position:relative;text-align:right}.workpad .vop{position:absolute;left:0;top:0;font:inherit}.workpad .separator{height:6px;background:var(--ink);margin:12px 0 8px}.workpad .vertical .total{border-top:0;margin-top:0;padding-top:0}.workpad .note{font-size:.85rem;color:var(--muted);text-align:center;line-height:1.5}.success-pop{background:#d9f7e9;border:3px solid #26a269;border-radius:18px;color:#176747;font-size:1.45rem;padding:12px;margin:12px auto;animation:pop .45s ease-out}.correct-flash{animation:flash .55s ease-out}@keyframes pop{0%{transform:scale(.75);opacity:.3}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes flash{0%{background:#e4faee}100%{background:transparent}}
    @media(max-width:650px){.mode-grid{grid-template-columns:1fr}.mode{min-height:0;padding:16px}.screen{border-radius:20px;padding:20px 15px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.logo{font-size:2rem}.play-area{grid-template-columns:1fr;gap:14px}.workpad{position:static;order:-1;padding:10px}.workpad .vertical{font-size:2.2rem;margin:6px auto}.workpad .note{display:none}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><div class="logo">🚀</div><div><h1>乘法探險隊</h1><div class="sub">兩位數乘兩位數・小四數學</div></div></div><button class="sound" id="soundBtn" aria-pressed="false">🔇 聲音：關</button></header>
  <section class="screen" id="home"><h2>選擇你的探險路線</h2><p>每局約 3–5 分鐘。準備好，就按下你的挑戰！</p><div class="mode-grid">
    <button class="mode" data-mode="Y"><span class="emoji">🌱</span><h3>Y 新手挑戰</h3><p>一步一步學直式，認識十位和個位，還有乘數表支援。</p></button>
    <button class="mode" data-mode="C"><span class="emoji">⭐</span><h3>C 達人挑戰</h3><p>看懂每一步的意思，找出直式錯誤，再完成計算。</p></button>
    <button class="mode" data-mode="H"><span class="emoji">🔥</span><h3>H 高手挑戰</h3><p>先估算、判斷合理性、逆向推理，為應用題作準備。</p></button>
  </div><div class="rules">💡 小提醒：直式計算固定是<strong>先計乘數十位，再計個位，最後相加</strong>。</div></section>
  <section class="screen hide" id="game"><div class="topbar"><button class="home-link" id="homeBtn">← 換一條路線</button><span class="pill" id="modeName"></span><span class="pill">⏱ <span id="time">180</span> 秒</span></div><div class="progress"><i id="bar"></i></div><div class="question" id="question"></div></section>
  <section class="screen hide result" id="result"><div class="medal" id="medal">🏅</div><h2>探險完成！</h2><div class="big-score" id="score">0 分</div><p id="encourage"></p><div class="stats"><div class="stat">正確率<b id="accuracy">0%</b></div><div class="stat">用時<b id="used">0 秒</b></div><div class="stat">星級<b id="stars">☆☆☆</b></div></div><div class="result-actions"><button class="next" id="replay">🔁 再玩一次</button><button class="secondary" id="other">🚀 挑戰其他程度</button></div></section>
  <div class="footer-note">可在 iPad、Windows 電腦及課室大屏幕使用</div>
</main>
<script>
(() => {
  'use strict';
  const qs=s=>document.querySelector(s), home=qs('#home'), game=qs('#game'), result=qs('#result');
  const sets={Y:[],C:[],H:[]};
  const randInt=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
  const makeSet=(minA,maxA,minB,maxB)=>{const out=[],seen=new Set();while(out.length<6){const pair=[randInt(minA,maxA),randInt(minB,maxB)],key=pair.join('x');if(!seen.has(key)){seen.add(key);out.push(pair)}}return out};
  let mode='Y', index=0, step=0, correct=0, attempts=0, started=0, timer=null, seconds=180, sound=false, locked=false;
  const speak=t=>{if(sound&&'speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}};
  const shuffle=a=>a.sort(()=>Math.random()-.5);
  function show(which){[home,game,result].forEach(x=>x.classList.add('hide'));which.classList.remove('hide')}
  function start(m){mode=m;sets.Y=makeSet(12,59,11,29);sets.C=makeSet(12,79,11,49);sets.H=makeSet(21,89,11,59);index=0;step=0;correct=0;attempts=0;seconds=180;started=Date.now();locked=false;qs('#modeName').textContent={Y:'🌱 Y 新手挑戰',C:'⭐ C 達人挑戰',H:'🔥 H 高手挑戰'}[m];show(game);clearInterval(timer);timer=setInterval(()=>{seconds--;qs('#time').textContent=seconds;if(seconds<=0)finish()},1000);render()}
  function current(){return sets[mode][index]}
  function render(){locked=false;const [a,b]=current(), product=a*b, tens=Math.floor(b/10)*10, ones=b%10, tensProd=a*tens, onesProd=a*ones;qs('#bar').style.width=((index+step/4)/sets[mode].length*100)+'%';let html='';
    if(mode==='Y'){const ySteps=[['第一步：先找乘數的十位',''+b+' 的十位數字代表多少？',[tens,tens/10,tens*10],'乘數中的 '+Math.floor(b/10)+' 在十位，代表 '+tens+'。'],['第二步：計算十位部分積',a+' × '+tens+' = ?',[tensProd,a*(tens/10),a*ones*10],'先計 '+a+' × '+tens+'，答案要記在十位部分積。'],['第三步：計算個位部分積',a+' × '+ones+' = ?',[onesProd,onesProd+10,onesProd-10],'再計乘數的個位 '+ones+'。'],['最後：把兩個部分積相加',tensProd+' + '+onesProd+' = ?',[product,product+10,product-10],'先十位、後個位，最後把兩個部分積相加。']][step];html=`<span class="tag">第 ${index+1} 題／${sets.Y.length} 題・步驟 ${step+1}/4</span><div class="equation">${a} × ${b} = ?</div><div class="step-label">${ySteps[0]}</div><p class="prompt">${ySteps[1]}</p><div class="options">${choices(ySteps[2])}</div><div class="hint">${ySteps[3]}</div><div class="feedback" id="feedback"></div>`;}
    if(mode==='C') html=`<span class="tag">第 ${index+1} 題／${sets.C.length} 題・步驟 ${step+1}/2</span><div class="equation">${a} × ${b} = ?</div><p class="prompt">${step===0?'直式偵探：先計乘數十位，哪個是正確部分積？':'找出最後答案：兩個部分積相加是多少？'}</p><div class="options">${choices(step===0?[tensProd,tensProd/10,onesProd]:[product,product+10,product-10])}</div><div class="feedback" id="feedback"></div>`;
    if(mode==='H'){const nearA=Math.round(a/10)*10,nearB=Math.round(b/10)*10;const hPrompt=step===0?'先估算被乘數：'+a+' 約是？':step===1?'再估算乘數：'+b+' 約是？':step===2?'用剛才的估算：'+nearA+' × '+nearB+' 約是多少？':step===3?'現在用直式計算真正答案：'+a+' × '+b+' = ？':'逆向推理：如果答案是 '+product+'，除以 '+b+' 可以找回哪個數字？';const hChoices=step===0?[nearA,nearA-10,nearA+10]:step===1?[nearB,nearB-10,nearB+10]:step===2?[nearA*nearB,nearA*nearB-100,nearA*nearB+100]:step===3?[product,product-10,product+10]:[a,a-1,a+1];html=`<span class="tag">第 ${index+1} 題／${sets.H.length} 題・步驟 ${step+1}/5</span><div class="equation">${a} × ${b} = ?</div><p class="prompt">${hPrompt}</p><p class="estimate">${step===3?'按直式程序先計十位，再計個位，最後把兩個部分積相加。':'估算時先找最接近的整十數，再判斷答案是否合理。'}</p><div class="options">${choices(hChoices)}</div><div class="feedback" id="feedback"></div>`;}
    const shownTens=mode==='Y'?(step<=1?'?':tensProd):(mode==='C'?(step<1?'?':tensProd):'?'), shownOnes=mode==='Y'?(step<=2?'?':onesProd):(mode==='C'?(step<1?'?':onesProd):'?'), shownTotal=mode==='Y'?(step<=3?'?':product):(mode==='C'?(step<2?'?':product):'?'); const workpad=`<aside class="workpad"><h3>🧮 本題直式</h3><div class="vertical"><div class="vrow">${a}</div><div class="vrow"><span class="vop">×</span>${b}</div><div class="separator"></div><div class="vrow">${shownTens}</div><div class="vrow">${shownOnes}</div><div class="separator"></div><div class="vrow total">${shownTotal}</div></div><div class="note">先十位，再個位<br>最後把兩個部分積相加</div></aside>`; qs('#question').innerHTML=`<div class="play-area"><div class="question-main">${html}</div>${workpad}</div>`; qs('#question').querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>answer(Number(btn.dataset.answer),btn))); speak(mode==='Y'?'先計乘數的十位，再計個位。':'想清楚再選答案。')}
  function round100(n){return Math.round(n/100)*100}
  function choices(arr){return shuffle([...new Set(arr)]).map(n=>`<button class="choice" data-answer="${n}">${n}</button>`).join('')}
  function answer(value,btn){if(locked)return;attempts++;const [a,b]=current(), tens=Math.floor(b/10)*10, ones=b%10, product=a*b, tensProd=a*tens, onesProd=a*ones, nearA=Math.round(a/10)*10, nearB=Math.round(b/10)*10;let expected=mode==='Y' ? [tens,tensProd,onesProd,product][step] : mode==='C' ? (step===0?tensProd:product) : [nearA,nearB,nearA*nearB,product,a][step];const ok=value===expected;if(!ok){btn.classList.add('wrong');const hint=mode==='Y'?(step===0?'先找出乘數十位所代表的數。':step===1?'想想看：乘數的十位要乘 10。':step===2?'現在處理乘數的個位。':'把兩個部分積重新相加。'):mode==='C'?(step===0?'偵探提示：先看乘數的十位及位值。':'請重新把兩個部分積對齊後相加。'):(step===0?'看個位數字，哪個整十數距離較近？':step===1?'看個位數字，哪個整十數距離較近？':step===2?'把兩個整十數相乘，注意 5 × 3 後有兩個 0。':step===3?'按直式先計十位，再計個位，最後相加。':'請用估算或乘除互相檢查，判斷哪個最合理。');qs('#feedback').textContent=hint+' 請留在這一步再試一次。';speak('再想一想，留在這一步再試一次。');return}locked=true;correct++;btn.classList.add('correct');qs('#feedback').className='feedback success-pop';qs('#feedback').textContent='✅ 答對了！';qs('#question').classList.add('correct-flash');speak('答對了！');setTimeout(()=>{if(mode==='Y'&&step<3){step++;render()}else if((mode==='C'||mode==='H')&&step<(mode==='H'?4:1)){step++;render()}else if(index<sets[mode].length-1){index++;step=0;render()}else finish()},900)}
  function finish(){if(!started)return;clearInterval(timer);const accuracy=attempts?Math.round(correct/attempts*100):0, used=Math.min(180,Math.round((Date.now()-started)/1000));qs('#score').textContent=accuracy+' 分';qs('#accuracy').textContent=accuracy+'%';qs('#used').textContent=used+' 秒';const stars=accuracy>=90?'⭐⭐⭐':accuracy>=60?'⭐⭐☆':'⭐☆☆';qs('#stars').textContent=stars;qs('#medal').textContent=accuracy>=90?'🏆':accuracy>=60?'🥇':'🌟';qs('#encourage').textContent=accuracy>=90?'太厲害了！你已經掌握這條路線！':accuracy>=60?'做得好！再玩一次會更穩！':'每一次練習都在進步，下一局再試試！';show(result);}
  document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));qs('#replay').addEventListener('click',()=>start(mode));qs('#other').addEventListener('click',()=>show(home));qs('#homeBtn').addEventListener('click',()=>{clearInterval(timer);show(home)});qs('#soundBtn').addEventListener('click',()=>{sound=!sound;qs('#soundBtn').textContent=sound?'🔊 聲音：開':'🔇 聲音：關';qs('#soundBtn').setAttribute('aria-pressed',String(sound))});
})();
</script>
</body>
</html>
